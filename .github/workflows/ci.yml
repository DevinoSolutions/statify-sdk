# Typecheck, unit tests and build on every PR and every push to main.
# The live smoke test (test/live.test.ts) never runs here: it needs
# STATIFY_API_KEY and also skips itself whenever CI is set.
#
# Publishing lives in release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The fleet's own runner for our own pushes and PRs (no GitHub-hosted minutes, 2026-11-26); a fork or
    # Dependabot PR stays on a hosted runner, so untrusted code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && 'ubuntu-devino' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # The engines floor is Node 20, but vitest 5 needs Node 22+. Build on 22, then
  # load the built ESM and CJS entries on Node 20 against a mock fetch.
  node20-dist:
    # The fleet's own runner for our own pushes and PRs (no GitHub-hosted minutes, 2026-11-26); a fork or
    # Dependabot PR stays on a hosted runner, so untrusted code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && 'ubuntu-devino' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - run: node --version && node scripts/smoke-dist.mjs
